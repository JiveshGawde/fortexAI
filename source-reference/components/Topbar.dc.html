<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height: 76px; min-height: 76px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 36px; background: rgba(7,10,16,0.7); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 20;">
  <div>
    <div style="font-size: 11px; font-weight: 700; color: #4a5568; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px;">Dashboard</div>
    <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.015em;">{{ title }}</div>
  </div>
  <div style="display: flex; align-items: center; gap: 20px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#a3adba" stroke-width="1.8" style="cursor: pointer;"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
    <div style="width: 1px; height: 22px; background: rgba(255,255,255,0.08);"></div>
    <div onclick="{{ goLanding }}" style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,#3fd8ff,#4f7fff); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #070a10; cursor: pointer; box-shadow: 0 0 16px rgba(79,127,255,0.35);" title="Sign out to landing">RM</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;title&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;goLanding&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}"></script>
</body>
</html>
