function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function genPrompts(count) {
  const rnd = mulberry32(20260701);
  const layers = ['Autoencoder', 'Semantic Search', 'Ensemble BERT', 'LLM Judge', 'Cosine Similarity'];
  const out = [];
  const now = new Date('2026-07-25T09:00:00Z').getTime();
  for (let i = 0; i < count; i++) {
    const bank = PROMPT_BANK[Math.floor(rnd() * PROMPT_BANK.length)];
    const [sender, department] = SENDERS[Math.floor(rnd() * SENDERS.length)];
    const minutesAgo = Math.floor(rnd() * 60 * 24 * 30);
    const ts = now - minutesAgo * 60000;
    let verdict, confidence, layer;
    if (bank.malicious) {
      confidence = Math.round(72 + rnd() * 27);
      verdict = confidence > 88 ? 'Blocked' : 'Flagged';
      layer = layers[Math.floor(rnd() * layers.length)];
    } else {
      confidence = Math.round(rnd() * 18);
      verdict = 'Passed';
      layer = '\u2014';
    }
    out.push({
      id: 'req_' + (1000 + i), timestamp: ts, sender, department, layer, confidence, verdict,
      preview: bank.text, tag: bank.malicious ? bank.tag : 'benign'
    });
  }
  return out.sort((a, b) => b.confidence - a.confidence);
}

function genTrend(n, seed) {
  const rnd = mulberry32(seed);
  const attempts = []; const blocked = [];
  let a = 20 + rnd() * 10; let b = a * 0.3;
  for (let i = 0; i < n; i++) {
    a = Math.max(4, a + (rnd() - 0.48) * 8 + Math.sin(i / 3) * 2);
    b = Math.max(1, Math.min(a * 0.9, b + (rnd() - 0.5) * 3));
    attempts.push(Math.round(a));
    blocked.push(Math.round(b));
  }
  return { attempts, blocked };
}

function buildPath(values, w, h, max, pad) {
  pad = pad || 4;
  const n = values.length;
  const step = (w - pad * 2) / (n - 1);
  return values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - (v / max) * (h - pad * 2);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

    const pad = 4, step = (w - pad * 2) / (n - 1);
    const pointLabelFor = (i) => {
      if (isCustomActive) return fmtDateShort(new Date(s.customFrom).getTime() + i * 86400000);
      if (s.kpiPeriod === '24h') return ((i) % 24) + ':00';
      if (s.kpiPeriod === '7d') return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i % 7];
      return fmtDateShort(Date.now() - (n - 1 - i) * 86400000);
    };
    const points = attempts.map((v, i) => ({
      x: +(pad + i * step).toFixed(1),
      y: +(h - pad - (v / max) * (h - pad * 2)).toFixed(1),
      yBlocked: +(h - pad - (blocked[i] / max) * (h - pad * 2)).toFixed(1),
      attemptVal: v, blockedVal: blocked[i], label: pointLabelFor(i),
    }));

    const donutTotal = kpiRaw.blocked + kpiRaw.flagged + kpiRaw.passed;
    const pctBlocked = (kpiRaw.blocked + kpiRaw.flagged) / donutTotal * 100;
    const circumference = 2 * Math.PI * 54;
    const donutData = {
      pctBlocked: pctBlocked.toFixed(1),
      dashArray: (pctBlocked / 100 * circumference).toFixed(1) + ' ' + circumference.toFixed(1),
      passedCount: fmtNum(kpiRaw.passed),
      blockedCount: fmtNum(kpiRaw.blocked + kpiRaw.flagged),
    };

    let filtered = ALL_PROMPTS.filter(p => {
      const f = s.filters;
      if (f.search && !(p.sender.toLowerCase().includes(f.search.toLowerCase()) || p.preview.toLowerCase().includes(f.search.toLowerCase()))) return false;
      if (f.verdict !== 'all' && p.verdict !== f.verdict) return false;
      if (f.layer !== 'all' && p.layer !== f.layer) return false;
      if (f.dateFrom && p.timestamp < new Date(f.dateFrom).getTime()) return false;
      if (f.dateTo && p.timestamp > new Date(f.dateTo).getTime() + 86400000) return false;
      return true;
    });
    filtered = filtered.slice().sort((a, b) => s.sortDir === 'desc' ? b.confidence - a.confidence : a.confidence - b.confidence);
    const filteredPrompts = filtered.map(p => ({ ...p, timeStr: fmtTime(p.timestamp) }));

    const layerOptions = ['Autoencoder', 'Semantic Search', 'Ensemble BERT', 'LLM Judge', 'Cosine Similarity'];
    const projectOptions = s.apiKeys.map(k => k.name);

    const nonPassed = ALL_PROMPTS.filter(p => p.verdict !== 'Passed');
    const layerCounts = {};
    nonPassed.forEach(p => { layerCounts[p.layer] = (layerCounts[p.layer] || 0) + 1; });
    const layerBreakdown = Object.entries(layerCounts).map(([layer, count]) => ({ layer, count })).sort((a, b) => b.count - a.count);

    const tagCounts = {};
    nonPassed.forEach(p => { tagCounts[p.tag] = (tagCounts[p.tag] || 0) + 1; });
    const tagBreakdown = Object.entries(tagCounts).map(([tag, count]) => ({ tag, count })).sort((a, b) => b.count - a.count);

    const senderCounts = {};
    nonPassed.forEach(p => { senderCounts[p.sender] = senderCounts[p.sender] || { sender: p.sender, department: p.department, count: 0 }; senderCounts[p.sender].count++; });
    const topRiskUsers = Object.values(senderCounts).sort((a, b) => b.count - a.count).slice(0, 6);

    const kpiDetails = {
      total: { type: 'trend', title: 'Total Prompts Processed', desc: 'Every prompt screened by the cascade, across all detection stages, in the selected window.' },
      malicious: { type: 'tags', title: '% Malicious / Flagged', desc: 'Share of traffic confirmed malicious or held for review, broken down by attack pattern.', rows: tagBreakdown.map(t => ({ label: t.tag, value: t.count })) },
      blocked: { type: 'layers', title: 'Blocked vs Passed \u2014 by detection layer', desc: 'Which cascade stage produced the final block or flag.', rows: layerBreakdown.map(l => ({ label: l.layer, value: l.count })) },
      latency: { type: 'layers', title: 'Avg Detection Latency \u2014 by stage', desc: 'Average time each stage adds to the cascade. Most traffic never reaches the slower stages.', rows: STAGE_LATENCY.map(l => ({ label: l.stage, value: l.ms + ' ms' })) },
      uptime: { type: 'trend', title: 'System Uptime & Throughput', desc: 'Service availability and requests/sec handled over the selected window.' },
      highrisk: { type: 'users', title: 'High-Risk Users', desc: 'Senders with the most confirmed-malicious or flagged prompts in this window.', rows: topRiskUsers.map(u => ({ label: u.sender, sub: u.department, value: u.count })) },
    };

    return {
      isLanding: s.view === 'landing', isLogin: s.view === 'login', isRegister: s.view === 'register', isDashboard: s.view === 'dashboard',
      goLanding: this.goLanding, goLogin: this.goLogin, goRegister: this.goRegister,
      loginForm: s.loginForm, setLoginField: this.setLoginField, submitLogin: this.submitLogin,
      registerForm: s.registerForm, setRegisterField: this.setRegisterField, submitRegister: this.submitRegister,
      dashView: s.dashView, setDashView: this.setDashView,
      dashTitle: { monitoring: 'Monitoring', api: 'API Keys', docs: 'Documentation', usage: 'Usage & Limits', billing: 'Billing', settings: 'Settings' }[s.dashView],
      isMonitoring: s.dashView === 'monitoring', isApiGen: s.dashView === 'api', isDocs: s.dashView === 'docs', isUsage: s.dashView === 'usage', isBilling: s.dashView === 'billing', isSettings: s.dashView === 'settings',
      kpiPeriod: s.kpiPeriod, setKpiPeriod: this.setKpiPeriod, kpiList,
      customFrom: s.customFrom, customTo: s.customTo, setCustomFrom: this.setCustomFrom, setCustomTo: this.setCustomTo, isCustomActive,
      trendData: { attemptsPath, blockedPath, attemptsArea, w, h, labels, points, maxLabel: fmtNum(Math.round(max)), midLabel: fmtNum(Math.round(max / 2)) },
      donutData,
      drilldownKpi: s.drilldownKpi, openDrilldown: this.openDrilldown, closeDrilldown: this.closeDrilldown, kpiDetails,
      filteredPrompts, filters: s.filters, setFilter: this.setFilter, sortDir: s.sortDir, toggleSort: this.toggleSort,
      expandedId: s.expandedId, toggleExpand: this.toggleExpand, feedback: s.feedback, setFeedback: this.setFeedback,
      layerOptions, project: s.project, setProject: this.setProject, projectOptions,
      apiKeys: s.apiKeys, showKeyModal: s.showKeyModal, openKeyModal: this.openKeyModal, closeKeyModal: this.closeKeyModal,
      keyNameInput: s.keyNameInput, setKeyName: this.setKeyName, generateKey: this.generateKey,
      newlyGeneratedKey: s.newlyGeneratedKey, copyKeyText: this.copyKeyText, toggleKeyStatus: this.toggleKeyStatus,
      confirmDeleteId: s.confirmDeleteId, askDeleteKey: this.askDeleteKey, cancelDeleteKey: this.cancelDeleteKey, confirmDeleteKey: this.confirmDeleteKey,
      settingsState: s.settingsState, toggleSetting: this.toggleSetting,
      toast: s.toast, toastBg: tp[0], toastBorder: tp[1], toastIcon: tp[2],
    };
  }
}

</script>
